<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA3 Contact Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;

            padding: 40px;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #111827;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 15px;
            font-family: inherit;

            background: #ffffff;

            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;

            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 20px;

            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you</p>
        </div>

        <form
            action="https://consoling-margarita-cardboard.ngrok-free.dev/submit.php"
            method="POST"
        >

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div class="footer">
            ISA3 Web Project
        </div>

    </div>

</body>
</html>
